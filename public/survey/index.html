<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumid Practice Survey</title>
<meta name="description" content="A 9-minute survey for psychologists and counsellors in Kerala.">
<link rel="icon" href="/icon.png">
<style>
/* Helvetica Now Display is licensed and git-ignored, same as the Evo app: drop the .ttf files into public/fonts/. */
@font-face{font-family:"Helvetica Now Display";src:url("/fonts/HelveticaNowDisplay-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Helvetica Now Display";src:url("/fonts/HelveticaNowDisplay-Medium.ttf") format("truetype");font-weight:500;font-display:swap}
</style>
<meta name="theme-color" content="#f6f8f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap">
<style>
/* Layout: Lumid Evo v3, mobile-first. A 393px phone column: glass header, one question, sticky Forest pill at the thumb. Light-only, as in the design system. */
:root{
  color-scheme:light;
  --bg:#f6f8f2; --ink:#151a13; --forest:#242e21; --t2:#3a4440; --t3:#6b7571; --border:#ecefed;
  --lime:#88d95f; --lime-deep:#3f8f22; --lime-soft:#e4f7d6; --lime-wash:#f3fbec;
  --peach:#f08a5d; --peach-soft:#ffe4d6; --peach-text:#b4532a; --amber:#f2b233;
  --glass:rgba(255,255,255,.78); --glass-2:rgba(255,255,255,.7); --track:rgba(36,46,33,.08);
  --shadow:0 10px 26px -8px rgba(26,64,20,.07); --shadow-lime:0 12px 26px -8px rgba(135,217,94,.45);
  --pill:linear-gradient(161deg,#33412e 0%,#151a13 71%);
  --font:"Helvetica Now Display","Helvetica Neue",Helvetica,"Inter Tight",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.glows{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.glows img{position:absolute;max-width:none}
.glows .ga{width:500px;height:460px;right:-190px;top:-200px}
.glows .gb{width:580px;height:520px;left:-250px;bottom:-230px}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;max-width:440px;margin:0 auto;padding-inline:24px}
button{font-family:inherit}
.glassy{background:var(--glass);border:1px solid #fff;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:14px 10px;margin-inline:-24px;padding-inline:20px;background:linear-gradient(var(--bg) 60%,rgba(246,248,242,0))}
.hrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn img{width:20px;height:20px;display:block}
.iconbtn:disabled{visibility:hidden}
.mode{justify-self:center;display:flex;align-items:center;gap:6px;padding:8px 14px 8px 12px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.01em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mode img{width:14px;height:14px;flex:none}
.left{justify-self:end;font-size:11px;line-height:14px;color:var(--t3);letter-spacing:.01em;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--track);margin:12px 4px 0;overflow:hidden}
.bar b{display:block;height:100%;width:100%;border-radius:2px;background:linear-gradient(90deg,var(--lime),#a3e27d);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
/* screen */
main{flex:1;padding-block:14px 8px}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .22s var(--ease)}
@keyframes in{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.bar b{transition:none}}
.eyebrow{font-size:12px;line-height:16px;font-weight:500;color:var(--lime-deep);letter-spacing:.01em}
h1.q{margin:2px 0 0;font-weight:500;font-size:clamp(24px,7vw,28px);line-height:1.1;letter-spacing:-.03em;color:var(--forest);text-wrap:balance}
.evo{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:22px;color:var(--ink)}
.evo img{width:28px;height:28px;flex:none;margin-top:-2px}
.label{font-size:14px;line-height:18px;font-weight:500;color:var(--t3)}
.caption{font-size:11px;line-height:14px;color:var(--t3);letter-spacing:.01em}
/* chips (Soft Chip) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:14px;line-height:18px;font-weight:500;color:var(--t3);background:var(--glass-2);border:1px solid #fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;transition:transform .18s,background .18s,box-shadow .18s}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--lime-soft);border:1.5px solid var(--lime);color:var(--forest);box-shadow:0 6px 12px -4px rgba(135,217,94,.45);padding:0 13.5px}
.chip:disabled{opacity:.4;cursor:not-allowed}
/* option cards (rung style) */
.cards{display:flex;flex-direction:column;gap:10px}
.card{min-height:60px;border-radius:20px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;color:var(--ink);transition:transform .18s,background .18s,box-shadow .18s}
.card:active{transform:scale(.985)}
.card .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(36,46,33,.18);background:#fff;flex:none}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card b{font-weight:500;font-size:14px;line-height:18px}
.card span{font-size:13px;line-height:18px;color:var(--t3)}
.card .badge{display:none}
.card[aria-pressed="true"]{background:var(--lime-soft);border:1.5px solid var(--lime);box-shadow:var(--shadow-lime);padding:11.5px 13.5px 11.5px 15.5px}
.card[aria-pressed="true"] .dot{border:4px solid var(--lime);width:18px;height:18px}
.card[aria-pressed="true"] .badge{display:block}
.badge{background:var(--forest);color:#fff;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.01em;padding:5px 10px;border-radius:999px;white-space:nowrap;flex:none}
/* inputs */
.field{width:100%;font-family:inherit;font-size:16px;line-height:22px;color:var(--ink);border-radius:20px;padding:14px 16px;outline:none;transition:border-color .18s,box-shadow .18s}
.field::placeholder{color:#9aa39f}
.field:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(136,217,95,.22)}
textarea.field{min-height:140px;resize:vertical}
:focus-visible{outline:2px solid var(--lime-deep);outline-offset:2px}
.panel{border-radius:24px;padding:18px}
.big{font-weight:500;font-size:56px;line-height:1;letter-spacing:-.035em;color:var(--forest);font-variant-numeric:tabular-nums}
.big small{font-size:14px;line-height:18px;letter-spacing:0;color:var(--t3);margin-left:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;margin:22px 0 4px;background:linear-gradient(90deg,var(--lime) 0 var(--p,50%),var(--track) var(--p,50%) 100%);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid #fff;box-shadow:0 4px 12px rgba(26,46,20,.22),0 0 0 6px rgba(136,217,95,.18)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 12px rgba(26,46,20,.22),0 0 0 6px rgba(136,217,95,.18)}
.ticks{display:flex;justify-content:space-between;font-size:11px;line-height:14px;color:var(--t3);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.split{display:flex;height:52px;border-radius:18px;overflow:hidden;font-size:13px;font-weight:500}
.split div{display:flex;align-items:center;padding-inline:14px;white-space:nowrap}
.split .on{background:var(--lime-soft);color:var(--forest);border-right:1.5px solid var(--lime)}
.split .off{justify-content:flex-end;color:var(--t2)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper .iconbtn{width:52px;height:52px;border-radius:26px;font-size:24px;color:var(--forest)}
/* ladder rank */
.ladder{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:46px;min-height:60px}
.ladder .rail{position:absolute;left:17px;top:30px;bottom:30px;width:6px;border-radius:3px;background:linear-gradient(var(--peach),var(--amber) 50%,var(--lime))}
.rung{position:relative;height:60px;border-radius:20px;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px}
.rung::before{content:"";position:absolute;left:-34px;top:22px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--c,var(--lime));box-sizing:border-box}
.rung .t{flex:1;min-width:0;font-size:14px;line-height:18px;font-weight:500}
.rung .n{font-size:12px;line-height:16px;color:var(--t3);font-weight:500;font-variant-numeric:tabular-nums;margin-right:2px}
.mini{width:32px;height:32px;border:0;border-radius:10px;background:transparent;color:var(--t3);font-size:15px;cursor:pointer}
.mini:hover{background:var(--lime-wash);color:var(--ink)}
.mini:disabled{opacity:.3}
.rank-empty{height:60px;border-radius:20px;border:1.5px dashed rgba(36,46,33,.14);display:flex;align-items:center;padding-inline:16px;color:var(--t3);font-size:14px}
.ladder.empty .rail{display:none}
.textlink{align-self:center;display:inline-flex;align-items:center;gap:6px;background:none;border:0;font-size:14px;line-height:18px;font-weight:500;color:var(--t2);cursor:pointer;padding:8px 4px}
.textlink img{width:14px;height:14px}
/* concept stack */
.concept{border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;user-select:none;transition:transform .22s var(--ease),opacity .22s}
.tag{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border-radius:999px;background:var(--lime-soft);color:var(--lime-deep);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.01em}
.tag img{width:13px;height:13px}
.concept h2{margin:0;font-weight:500;font-size:21px;line-height:1.1;letter-spacing:-.03em;color:var(--ink)}
.concept p{margin:0;font-size:15px;line-height:22px;color:var(--t2)}
.concept .eg{background:var(--lime-wash);border-radius:14px;padding:10px 12px;font-size:13px;line-height:18px;color:var(--t2)}
.meter{display:flex;gap:3px;justify-content:center}
.meter i{width:10px;height:4px;border-radius:2px;background:var(--track)}
.meter i.done{background:var(--lime)}
.meter i.cur{background:var(--forest)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote .chip{justify-content:center;height:46px}
.vote .yes{grid-column:1/-1;height:52px;justify-content:center;background:var(--lime);border:0;color:var(--forest);box-shadow:var(--shadow-lime);font-size:14px}
/* faces */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;line-height:14px;color:var(--t3);cursor:pointer}
.face svg{width:34px;height:34px;color:var(--forest)}
.face[aria-pressed="true"]{background:var(--lime-soft);border:1.5px solid var(--lime);box-shadow:var(--shadow-lime);color:var(--forest)}
/* price */
.prow{display:flex;flex-direction:column;gap:2px}
.prow .v{font-size:34px;line-height:1.05;font-weight:500;letter-spacing:-.03em;color:var(--forest);font-variant-numeric:tabular-nums}
.prow .v small{font-size:13px;color:var(--t3);letter-spacing:0}
.sep{height:1px;background:var(--border);margin:14px 0}
/* toggle list (Sharing) */
.list{border-radius:24px;padding:6px 18px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row b{font-weight:500;font-size:14px;line-height:18px}
.row .sub{display:flex;align-items:center;gap:4px;font-size:11px;line-height:14px;color:var(--t3);letter-spacing:.01em}
.row .sub img{width:11px;height:11px}
.toggle{position:relative;width:44px;height:26px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:13px;background:rgba(36,46,33,.1);transition:background .2s}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(20,26,18,.18);transition:transform .2s var(--ease)}
.toggle input:checked+span{background:var(--lime)}
.toggle input:checked+span::after{transform:translateX(18px)}
.toggle input:focus-visible+span{outline:2px solid var(--lime-deep);outline-offset:2px}
/* forest hero card */
.hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(165deg,#33412e 0%,#151a13 71%);color:#fff;padding:20px 18px;display:flex;gap:14px;align-items:center}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(136,217,95,.35),transparent 70%)}
.hero .av{width:52px;height:52px;border-radius:26px;background:var(--lime-soft);display:grid;place-items:center;flex:none}
.hero .av img{width:34px;height:34px}
.hero b{display:block;font-weight:500;font-size:17px;line-height:22px;letter-spacing:-.01em}
.hero span{font-size:13px;line-height:18px;color:var(--lime)}
.points{display:flex;flex-direction:column;gap:8px}
.pt{display:flex;gap:10px;font-size:13px;line-height:18px;color:var(--t2)}
.pt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--lime));flex:none;margin-top:5px}
.pt b{font-weight:500;color:var(--ink)}
.ehead{display:flex;align-items:center;gap:8px;font-size:14px;line-height:18px;font-weight:500;color:var(--lime-deep)}
.ehead img{width:16px;height:16px}
.share{display:flex;gap:8px}
.share code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit;font-size:13px;border-radius:999px;padding:0 16px;display:flex;align-items:center;height:46px;color:var(--t2)}
details{font-size:13px;color:var(--t3)}
details summary{cursor:pointer;padding:6px 0}
details pre{font-size:11px;line-height:15px;background:var(--glass);border:1px solid #fff;border-radius:16px;padding:12px;overflow:auto;max-height:240px;color:var(--ink)}
.err{color:var(--peach-text);font-size:12px;line-height:16px;margin-top:6px}
.flabel{display:block;font-size:14px;line-height:18px;font-weight:500;color:var(--ink);margin-bottom:8px}
.intro h1{margin:6px 0 0;font-weight:500;font-size:clamp(32px,9.5vw,38px);line-height:1.04;letter-spacing:-.035em;color:var(--forest);text-wrap:balance}
.intro .orb{width:64px;height:64px;margin:4px 0 -4px -6px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:999px;font-size:12px;font-weight:500;color:var(--forest)}
.facts span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
/* footer: Forest pill */
footer.act{position:sticky;bottom:0;z-index:5;margin-inline:-24px;padding:16px 24px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(246,248,242,0),var(--bg) 35%);display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{position:relative;width:100%;height:58px;border:0;border-radius:999px;background:var(--pill);color:#fff;font-size:14px;line-height:18px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;filter:drop-shadow(0 14px 14px rgba(20,26,18,.28));box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:transform .18s,opacity .2s}
.pill img{width:18px;height:18px}
.pill:active{transform:scale(.98)}
.pill:disabled{opacity:.32;cursor:not-allowed;filter:none}
.pill.lime{background:var(--lime);color:var(--forest);filter:drop-shadow(0 12px 14px rgba(135,217,94,.45))}
.foot-note{font-size:11px;line-height:14px;color:var(--t3);letter-spacing:.01em;text-align:center;min-height:14px}
</style>

</head>

<div class="app">

   h('button',{class:'iconbtn glassy','aria-label':'Decrease',on:{click:()=>change(-1)}},'−'),
   h('div',{class:'big','aria-live':'polite',style:'text-align:center'},num,h('small',null,q.unit)),

function rank(q){const wrap=h('div',{style:'display:flex;flex-direction:column;gap:14px'});const ladder=h('div',{class:'ladder'});const pool=h('div',{class:'chips'});
 const list=shuffled('C1',PAINS);
 const noneBtn=h('button',{class:'textlink',on:{click:()=>{S.a.C1none=!S.a.C1none;if(S.a.C1none)S.a.C1=[];set('C1',S.a.C1||[]);draw()}}});
 const draw=()=>{const v=S.a.C1||[];ladder.innerHTML='';pool.innerHTML='';ladder.classList.toggle('empty',!v.length);
  ladder.append(h('div',{class:'rail'}));
  if(!v.length)ladder.append(h('div',{class:'rank-empty'},S.a.C1none?'None of these is a real problem':'Your ranking builds here'));
  v.forEach((k,i)=>ladder.append(h('div',{class:'rung glassy',style:`--c:${RANKC[i]}`},
   h('span',{class:'t'},painLabel(k)),h('span',{class:'n'},`#${i+1}`),
   h('button',{class:'mini','aria-label':'Move up',disabled:i===0,on:{click:()=>{const s=[...v];[s[i-1],s[i]]=[s[i],s[i-1]];set('C1',s);draw()}}},'↑'),
   h('button',{class:'mini','aria-label':'Remove',on:{click:()=>{set('C1',v.filter(x=>x!==k));draw()}}},'×'))));
  list.filter(p=>!v.includes(p.k)).forEach(p=>pool.append(h('button',{class:'chip','aria-pressed':'false',on:{click:()=>{S.a.C1none=false;set('C1',[...v,p.k]);draw()}}},p.l)));
  noneBtn.replaceChildren(img(ICON.pencil),S.a.C1none?'Undo: some of these do slow me down':'None of these is a real problem for me')};
 wrap.append(ladder,h('div',{class:'label'},'Tap to add, most painful first'),pool,noneBtn);draw();return wrap}

function stack(q){const wrap=h('div',{style:'display:flex;flex-direction:column;gap:14px'});const order=shuffled('D1',CONCEPTS);if(!S.a.D1)S.a.D1={};
 const draw=()=>{wrap.innerHTML='';const v=S.a.D1;const i=order.findIndex(c=>!v[c.k]);
  const meter=h('div',{class:'meter','aria-hidden':'true'},order.map((c,j)=>h('i',{class:v[c.k]?'done':(j===i?'cur':'')})));
  if(i===-1){const w=CONCEPTS.filter(c=>v[c.k]==='weekly').length;
   wrap.append(h('div',{class:'panel glassy points'},h('div',{class:'ehead'},img(ICON.sparkle),'All seven rated'),h('div',{class:'pt'},h('span',null,h('b',null,`${w} of 7`),' you’d use every week'))),meter,
    h('button',{class:'textlink',on:{click:()=>{delete S.a.D1[order.at(-1).k];save();refreshNext();draw()}}},img(ICON.pencil),'Change my last answer'));return}
  const c=order.at(i);
  const card=h('article',{class:'concept glassy','aria-label':`Idea ${i+1} of ${order.length}: ${c.t}`},h('span',{class:'tag'},img(ICON.sparkle),`Idea ${i+1} of 7 · ${c.tag}`),h('h2',null,c.t),h('p',null,c.d),h('div',{class:'eg'},c.eg));
  const vote=(val)=>{card.style.transform=val==='weekly'?'translateX(48px) rotate(3deg)':val==='no'?'translateX(-48px) rotate(-3deg)':'translateY(-12px)';card.style.opacity='0';
   setTimeout(()=>{S.a.D1={...S.a.D1,[c.k]:val};save();refreshNext();draw();if(valid(q))setTimeout(goNext,380)},200)};
  let x0=null;card.addEventListener('pointerdown',e=>{x0=e.clientX;card.setPointerCapture(e.pointerId)});
  card.addEventListener('pointermove',e=>{if(x0==null)return;const dx=e.clientX-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`});
  const end=e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(dx>80)vote('weekly');else if(dx<-80)vote('no');else card.style.transform=''};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',()=>{x0=null;card.style.transform=''});
  wrap.append(card,meter,h('div',{class:'vote'},
   h('button',{class:'chip yes',on:{click:()=>vote('weekly')}},'I’d use it every week'),
   h('button',{class:'chip',on:{click:()=>vote('sometimes')}},'Sometimes'),h('button',{class:'chip',on:{click:()=>vote('no')}},'Not for me')));
  if(i>0)wrap.append(h('button',{class:'textlink',on:{click:()=>{delete S.a.D1[order.at(i-1).k];save();refreshNext();draw()}}},img(ICON.pencil),'Undo last'));};
 draw();return wrap}

function faceSvg(n){const c=[-7,-3.5,0,4,8][n];return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14" cy="16" r="1.8" fill="currentColor"/><circle cx="26" cy="16" r="1.8" fill="currentColor"/><path d="M12 ${26-c/2} Q20 ${26+c} 28 ${26-c/2}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`}
function faces(q){const labels=['Not at all','Uneasy','Unsure','Fairly','Very'];const box=h('div',{class:'faces',role:'radiogroup','aria-labelledby':'qtitle'});
 labels.forEach((l,i)=>box.append(h('button',{class:'face glassy','aria-pressed':String(S.a[q.id]===i+1),'aria-label':`${i+1} of 5, ${l}`,on:{click:()=>{[...box.children].forEach(c=>c.setAttribute('aria-pressed','false'));box.children[i].setAttribute('aria-pressed','true');set(q.id,i+1,true)}}},h('span',{html:faceSvg(i)}),l)));

function price(q){const MAX=5000;if(!S.a.F3)S.a.F3={good:800,expensive:2000};
 const fmt=v=>'₹'+v.toLocaleString('en-IN');const gv=h('div',{class:'v'}),ev=h('div',{class:'v'});
 const draw=()=>{const {good,expensive}=S.a.F3;gv.replaceChildren(fmt(good),h('small',null,' /month'));ev.replaceChildren(fmt(expensive),h('small',null,' /month'));fill(g);fill(x)};
 const g=h('input',{type:'range',id:'F3good',min:0,max:MAX,step:100,value:S.a.F3.good,'aria-label':'Good deal price',on:{input:e=>{const n=+e.target.value;const s={...S.a.F3,good:n};if(s.expensive<n){s.expensive=n;x.value=n}set('F3',s);draw()}}});
 const x=h('input',{type:'range',id:'F3exp',min:0,max:MAX,step:100,value:S.a.F3.expensive,'aria-label':'Too expensive price',on:{input:e=>{let n=+e.target.value;if(n<S.a.F3.good){n=S.a.F3.good;e.target.value=n}set('F3',{...S.a.F3,expensive:n});draw()}}});

   h('div',{class:'sep'}),
   h('div',{class:'prow'},h('label',{class:'label',for:'F3exp'},'Starts to feel too expensive at'),ev),x,
   h('div',{class:'ticks',style:'margin-top:6px'},h('span',null,'₹0'),h('span',null,'₹5,000')))}

function textQ(q){const t=h('textarea',{class:'field glassy',id:q.id,placeholder:q.ph||'',on:{input:e=>set(q.id,e.target.value)}});t.value=S.a[q.id]||'';

function contact(q){if(!S.a.G2)S.a.G2={};const v=S.a.G2;const err=h('div',{class:'err',hidden:true},'Enter a 10-digit Indian mobile number, like 98470 12345.');

function intro(){const s=h('section',{class:'screen intro'});
 const btn=pill('Start the survey',start,{disabled:!S.consent});
 const tog=(id,title,sub,checked,onc)=>h('label',{class:'row',for:id},h('span',{class:'tx'},h('b',null,title),sub?h('span',{class:'sub'},img(ICON.lock),sub):null),h('span',{class:'toggle'},h('input',{type:'checkbox',id,role:'switch',checked,on:{change:onc}}),h('span')));

 return s}

 const mail=h('input',{type:'email',class:'field glassy',id:'exitmail',inputmode:'email',placeholder:'you@example.com',value:S.a.exit_email||'',on:{input:e=>{S.a.exit_email=e.target.value;save()}}});

function doneScreen(){const s=h('section',{class:'screen'});const a=S.a;
 const pick=CONCEPTS.find(c=>c.k===a.D2);const weekly=a.D1?CONCEPTS.filter(c=>a.D1[c.k]==='weekly').length:0;

 const copy=h('button',{class:'chip yes',style:'height:46px;padding:0 18px;background:var(--lime);border:0;color:var(--forest)',on:{click:()=>{const ok=()=>copy.textContent='Copied';const sel=()=>{const r=document.createRange();r.selectNodeContents(code);getSelection().removeAllRanges();getSelection().addRange(r)};navigator.clipboard?navigator.clipboard.writeText(url).then(ok,sel):sel()}}},'Copy');

 s.append(h('div',null,h('div',{class:'eyebrow'},'All done'),h('h1',{class:'q'},'Thank you. This really helps.')),
  h('div',{class:'hero'},h('div',{class:'av'},img(ICON.orb)),h('div',{style:'position:relative;z-index:1'},h('b',null,a.G1==='yes'?(name?`See you soon, ${name.split(' ')[0]}`:'You’re a founding pilot'):a.G1==='maybe'?'Pilot details on the way':'You’re on the early-access list'),
   h('span',null,a.G1==='yes'?'We’ll message you on WhatsApp within 2 days':a.G1==='maybe'?'We’ll send details before asking anything':'Results summary within 2 weeks'))),

   h('div',{class:'pt',style:'--c:#8b7cf0'},h('span',null,'Ideas you’d use every week: ',h('b',null,`${weekly} of 7`)))),
  h('div',{class:'label'},'Know a colleague who should weigh in?'),h('div',{class:'share'},code,copy),
  h('details',null,h('summary',null,'Prototype: view the response record'),h('pre',null,json)));

  h('button',{class:'textlink',on:{click:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();render()}}},'Take it again'));

document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();
